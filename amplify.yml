# AWS Amplify Hosting build spec.
#
# Kept in the repo rather than the Amplify console so it is reviewable and
# travels with the code. Amplify picks this up automatically from the root.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next 16 and Payload 3 both want Node 20+; Amplify's default is older.
        - nvm install 22 && nvm use 22
        # Amplify ships npm and yarn, not pnpm. Corepack reads the version from
        # the "packageManager" field in package.json.
        - corepack enable && corepack prepare --activate
        - pnpm install --frozen-lockfile
        # Amplify reliably injects env vars at build time; reaching the SSR
        # runtime has been inconsistent across versions, and PAYLOAD_SECRET and
        # DATABASE_URI are both read at runtime. This lands inside the server
        # bundle, not in public/.
        - env | grep -E '^(DATABASE_|PAYLOAD_|NEXT_PUBLIC_|S3_)' >> .env.production
        # NOTE: `pnpm migrate` is deliberately NOT run here. The Payload CLI
        # hangs indefinitely on this project after "Reading migration files" —
        # it opens a connection, issues no query, and never exits. In a build
        # that means a 30-minute timeout rather than a clean failure.
        #
        # Safe to skip for now: the schema already exists and
        # 20260825_032057_initial is recorded in payload_migrations, so the
        # command would be a no-op even if it worked.
        #
        # Before the NEXT schema change, this has to be fixed or migrations
        # applied by hand — otherwise new columns will silently never reach
        # production. See `pnpm migrate:status`, which does work.
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
